# TaskFlow — distributed job scheduling and execution platform
# Requires: Java 21, Maven 3.9+

version: '1'
services:
  - type: web
    name: taskflow-api
    env: java
    plan: free
    buildCommand: mvn package -DskipTests -B
    startCommand: java -jar target/taskflow-api.jar
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: taskflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: taskflow-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_NAME
        value: render-worker
