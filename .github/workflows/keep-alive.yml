# Pings the deployed TaskFlow API every 10 minutes so the Render free-tier
# service never spins down. /health is cheap and side-effect free.
name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TaskFlow health endpoint
        run: |
          curl -sS -o /dev/null -m 120 --retry 2 --retry-delay 5 \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            https://taskflow-api-nsg7.onrender.com/health
